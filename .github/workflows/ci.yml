name: Workbench validation
on:
  pull_request:
    branches: [workbench-backend]
  push:
    branches: ["chore/**", "feat/**", "fix/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: source-and-chat-windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: backend
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: David7583/baigong-workbench-frontend
          ref: 00baf4b4358aac5f3027fba21083be1af31d3249
          path: frontend
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install -r backend/tools/repository-audit.requirements.txt
      - name: Validate metadata, source manifest and syntax
        run: python backend/tests/repository_check_v0001.py
      - name: Initialize isolated backend
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv backend/.venv
          & ./backend/.venv/Scripts/python.exe -m pip install -r backend/requirements.lock.txt
          & ./backend/.venv/Scripts/python.exe backend/setup_workbench_v0001.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test backend API, permissions and persistence
        shell: pwsh
        run: |
          $env:RELEASE_TEST_ROOT = (Resolve-Path backend).Path
          $env:WORKBENCH_FRONTEND_ROOT = (Resolve-Path frontend).Path
          node --test backend/tests/release_contract_test_v0001.cjs
