  base_url: http://127.0.0.1:11434
  protocol: ollama_native
  authentication:
    mode: none
  connect_timeout_seconds: 5
  read_timeout_seconds: 180
  max_retries: 0
endpoints:
  version: /api/version
  list_models: /api/tags
  running_models: /api/ps
  show_model: /api/show
  chat: /api/chat
  embed: /api/embed
selected_models:
  chat: qwen3:8b
  embedding: null
request_defaults:
  stream: false
  keep_alive: 5m
  options: {}
policies:
  require_installed_model: true
  allow_remote_models: false
  auto_pull: false
  auto_start_server: false
  fallback_to_cloud: false
logging:
  log_request_bodies: false
  log_response_bodies: false
model_inventory:
