schema_version: '1.0'
checked_on: '2026-09-21'
scope: 公开文档快照；不等于账号授权、运行支持或穷尽未来新增/私有微调型号
capability_semantics: capabilities 为已记录的主要用途；未列出不等于不支持。capability_details 中 true/false
  才表示明确核对的支持状态。
providers:
  openai:
    display_name: OpenAI
    default_credential: openai_default
    default_profile: default
    authentication:
      header: Authorization
      scheme: Bearer
    profiles:
      default:
        base_url: https://api.openai.com/v1
        protocol: openai
        credential: openai_default
        headers: {}
        source_ids:
        - openai_api
      admin:
        base_url: https://api.openai.com/v1
        protocol: openai_admin
        credential: openai_admin
        headers: {}
        source_ids:
        - openai_api
    resource_families:
    - responses
    - chat_completions
    - completions_legacy
    - conversations
    - agents
    - sessions
    - environments
    - sandboxes
    - plugins
    - vaults
    - traces
    - live
    - realtime
    - transcription
    - translation
    - speech
    - voices
    - images
    - videos
    - embeddings
    - moderation
    - files
    - uploads
    - vector_stores
    - batches
    - fine_tuning
    - evals
    - graders
    - models
    - assistants_legacy
    - containers
    - organization_admin
    - projects
    - service_accounts
    - api_keys
    - usage
    - costs
    - webhooks
    - workload_identity
    model_list_refresh:
      enabled: false
      requires_explicit_authorization: true
    request_defaults: {}
    notes: []
models:
- provider: openai
  model_id: gpt-4.1-mini
  enabled: false
  lifecycle: documented
  account_availability: not_checked
  capabilities:
  - streaming
  - structured_outputs
  - text_generation
  - tool_calling
  - vision
  capability_details:
    streaming: true
    tool_calling: true
    structured_outputs: true
    fine_tuning: true
  source_ids:
  - oa_gpt-4_1-mini
  request_defaults: {}
  notes: []
  modalities:
    text: input_and_output
    image: input_only
    audio: not_supported
    video: not_supported
  context_tokens: 1047576
  max_output_tokens: 32768
  capability_summary_zh: 流式输出、结构化输出、文本生成与对话、工具调用、图像理解
