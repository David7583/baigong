# 官方文档核查日期：2026-09-21；密钥与公开能力目录分离。
schema_version: '2.0'
kind: example
catalog: ai_api_catalog_v0001.yml
runtime:
  network_enabled: false
  automatic_provider_fallback: false
  connect_timeout_seconds: 10
  read_timeout_seconds: 120
  max_retries: 2
  retry_statuses:
  - 408
  - 429
  - 500
  - 502
  - 503
  - 504
  retry_non_idempotent_requests: false
  log_secrets: false
  log_request_bodies: false
  log_response_bodies: false
credentials:
  openai_default:
    provider: openai
    source: environment
    environment_variable: OPENAI_API_KEY
    value: ''
    scope: inference
    region: null
